<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050707">
    <meta name="robots" content="noindex, nofollow">

    <title>Holofly Negócios | Em construção</title>
    <meta name="description" content="A nova página Holofly Negócios está em construção.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="icon" href="../icons/favicon3232.png" type="image/png">

    <style>
        :root {
            --background: #050707;
            --surface: rgba(13, 17, 19, 0.9);
            --text: #ffffff;
            --muted: #aeb8ba;
            --cyan: #20ddeb;
            --blue: #1b91ee;
            --magenta: #ff3fd3;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            font-family: "Inter", sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 15%, rgba(32, 221, 235, 0.12), transparent 32rem),
                radial-gradient(circle at 88% 88%, rgba(255, 63, 211, 0.09), transparent 30rem),
                var(--background);
        }

        .construction-card {
            position: relative;
            width: min(100%, 620px);
            padding: clamp(34px, 8vw, 64px);
            overflow: hidden;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 32px;
            background: linear-gradient(145deg, rgba(18, 24, 27, 0.96), var(--surface));
            box-shadow: 0 32px 90px rgba(0, 0, 0, 0.5), 0 0 42px rgba(32, 221, 235, 0.06);
        }

        .construction-card::before {
            content: "";
            position: absolute;
            top: -110px;
            right: -90px;
            width: 240px;
            height: 240px;
            border: 1px solid rgba(32, 221, 235, 0.16);
            border-radius: 50%;
            box-shadow: 0 0 55px rgba(255, 63, 211, 0.07);
            pointer-events: none;
        }

        .brand-link {
            width: 76px;
            height: 76px;
            margin: 0 auto;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(5, 8, 9, 0.72);
        }

        .brand-link img {
            width: 54px;
            height: auto;
            display: block;
        }

        .eyebrow {
            margin-top: 28px;
            color: var(--cyan);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin-top: 12px;
            font-size: clamp(2rem, 8vw, 3.5rem);
            line-height: 1.05;
            letter-spacing: -0.045em;
        }

        .description {
            max-width: 430px;
            margin: 20px auto 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.65;
        }

        .home-link {
            min-height: 50px;
            margin-top: 30px;
            padding: 14px 23px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #001012;
            font-size: 0.92rem;
            font-weight: 800;
            text-decoration: none;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--cyan), var(--blue));
            box-shadow: 0 12px 36px rgba(32, 221, 235, 0.17);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .home-link:hover,
        .home-link:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 15px 42px rgba(32, 221, 235, 0.25);
            outline: none;
        }

        .footer-note {
            margin-top: 32px;
            color: #707a7d;
            font-size: 0.76rem;
        }

        @media (max-width: 420px) {
            body {
                padding: 14px;
            }

            .construction-card {
                padding: 34px 22px;
                border-radius: 26px;
            }

            .brand-link {
                width: 68px;
                height: 68px;
                border-radius: 21px;
            }

            .brand-link img {
                width: 48px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .home-link {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="construction-card">
        <a class="brand-link" href="../index.html" aria-label="Voltar para a página inicial da Holofly">
            <img src="../icons/logo.png" alt="" width="886" height="568" decoding="async">
        </a>

        <p class="eyebrow">Holofly Negócios</p>
        <h1>Estamos em construção</h1>
        <p class="description">Estamos preparando uma nova experiência para conectar seu negócio à criatividade certa. Voltamos em breve.</p>

        <a class="home-link" href="../index.html">
            Voltar para a Holofly <span aria-hidden="true">→</span>
        </a>

        <p class="footer-note">© 2026 Holofly</p>
    </main>
</body>
</html>
