    <style>
        :root {
            --ink: #050607;
            --surface: rgba(14, 17, 20, 0.88);
            --surface-strong: #0c0f12;
            --text: #ffffff;
            --muted: #a8b0b8;
            --border: rgba(255, 255, 255, 0.1);
            --cyan: #20ddeb;
            --blue: #1b91ee;
            --magenta: #ff3fd3;
            --pink: #ff0080;
        }

        * {
            font-family: "Inter", sans-serif;
        }

        html {
            background: var(--ink);
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at 14% 8%, rgba(32, 221, 235, 0.12), transparent 29rem),
                radial-gradient(circle at 88% 88%, rgba(255, 63, 211, 0.1), transparent 28rem),
                var(--ink);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: 0;
            width: 220px;
            height: 220px;
            border: 1px solid rgba(255, 255, 255, 0.055);
            border-radius: 50%;
            pointer-events: none;
        }

        body::before {
            top: -108px;
            left: -112px;
            box-shadow: 0 0 70px rgba(32, 221, 235, 0.08);
        }

        body::after {
            right: -128px;
            bottom: -116px;
            box-shadow: 0 0 70px rgba(255, 63, 211, 0.07);
        }

        .links-page {
            position: relative;
            z-index: 1;
            width: min(calc(100% - 24px), 560px);
            min-height: 100svh;
            margin: 0 auto;
            padding: max(28px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .brand-mark {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(8, 11, 13, 0.82);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.38), 0 0 28px rgba(32, 221, 235, 0.09);
        }

        .brand-mark img {
            width: 48px;
            height: auto;
            display: block;
        }

        .brand-name {
            margin-top: 14px;
            font-size: 1.34rem;
            font-weight: 800;
            letter-spacing: 0.11em;
        }

        .brand-tagline {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .choice-section {
            margin-top: 30px;
        }

        .choice-title {
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.88);
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
        }

        .choice-list {
            display: grid;
            gap: 14px;
        }

        .choice-card {
            position: relative;
            isolation: isolate;
            min-height: 148px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(19, 24, 28, 0.96), rgba(8, 10, 12, 0.98));
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .choice-card::before {
            content: "";
            position: absolute;
            z-index: -1;
            top: -72px;
            right: -58px;
            width: 176px;
            height: 176px;
            border-radius: 50%;
            opacity: 0.17;
            filter: blur(2px);
        }

        .choice-card--creative::before {
            background: radial-gradient(circle, var(--cyan), transparent 68%);
        }

        .choice-card--business::before {
            background: radial-gradient(circle, var(--magenta), transparent 68%);
        }

        .choice-card--creative:hover,
        .choice-card--creative:focus-visible {
            border-color: rgba(32, 221, 235, 0.48);
            box-shadow: 0 18px 52px rgba(0, 0, 0, 0.34), 0 0 28px rgba(32, 221, 235, 0.1);
        }

        .choice-card--business:hover,
        .choice-card--business:focus-visible {
            border-color: rgba(255, 63, 211, 0.46);
            box-shadow: 0 18px 52px rgba(0, 0, 0, 0.34), 0 0 28px rgba(255, 63, 211, 0.09);
        }

        .choice-card:hover,
        .choice-card:focus-visible {
            transform: translateY(-3px);
            outline: none;
        }

        .choice-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.02rem;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .choice-symbol {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border: 1px solid currentColor;
            border-radius: 11px;
            font-size: 0.95rem;
        }

        .choice-card--creative .choice-symbol,
        .choice-card--creative .choice-cta {
            color: var(--cyan);
        }

        .choice-card--business .choice-symbol,
        .choice-card--business .choice-cta {
            color: var(--magenta);
        }

        .choice-copy {
            max-width: 30rem;
            margin-top: 12px;
            color: #c3c9cf;
            font-size: 0.96rem;
            line-height: 1.5;
        }

        .choice-cta {
            margin-top: 17px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.93rem;
            font-weight: 700;
        }

        .choice-cta span {
            transition: transform 180ms ease;
        }

        .choice-card:hover .choice-cta span,
        .choice-card:focus-visible .choice-cta span {
            transform: translateX(4px);
        }

        .about-link {
            margin-top: 14px;
            padding: 17px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            color: var(--text);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.075);
            border-radius: 18px;
            background: rgba(10, 12, 14, 0.68);
            transition: border-color 180ms ease, background 180ms ease;
        }

        .about-link:hover,
        .about-link:focus-visible {
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(16, 19, 22, 0.86);
            outline: none;
        }

        .about-link strong {
            display: block;
            font-size: 0.95rem;
        }

        .about-link small {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .about-arrow {
            color: rgba(255, 255, 255, 0.56);
            font-size: 1.1rem;
        }

        .page-end {
            margin-top: auto;
            padding-top: 26px;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .social-link {
            min-height: 42px;
            padding: 8px 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ccd1d5;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            background: rgba(9, 11, 13, 0.66);
            transition: color 180ms ease, border-color 180ms ease;
        }

        .social-link:hover,
        .social-link:focus-visible {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            outline: none;
        }

        .social-link img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .links-footer {
            margin-top: 18px;
            color: #747c83;
            font-size: 0.75rem;
        }

        @media (min-width: 700px) {
            .links-page {
                padding-top: 44px;
                padding-bottom: 32px;
            }

            .choice-section {
                margin-top: 34px;
            }

            .choice-card {
                min-height: 154px;
                padding: 24px 26px;
            }
        }

        @media (max-width: 359px) {
            .links-page {
                width: min(calc(100% - 20px), 560px);
            }

            .brand-mark {
                width: 62px;
                height: 62px;
            }

            .brand-mark img {
                width: 43px;
            }

            .choice-section {
                margin-top: 25px;
            }

            .choice-card {
                min-height: 142px;
                padding: 19px;
                border-radius: 21px;
            }

            .choice-copy {
                font-size: 0.9rem;
            }

            .about-link {
                padding: 15px;
            }
        }

        @media (prefers-reduced-motion: no-preference) {
            .brand-mark {
                animation: brand-glow 5s ease-in-out infinite;
            }

            @keyframes brand-glow {
                0%, 100% { box-shadow: 0 16px 45px rgba(0, 0, 0, 0.38), 0 0 24px rgba(32, 221, 235, 0.07); }
                50% { box-shadow: 0 16px 45px rgba(0, 0, 0, 0.38), 0 0 30px rgba(255, 63, 211, 0.1); }
            }
        }
    </style>
</head>
<body>
    <main class="links-page">
        <header class="brand">
            <a class="brand-mark" href="https://holofly.com.br" aria-label="Ir para a página inicial da Holofly">
                <img src="../icons/logo.png" alt="" width="886" height="568" decoding="async">
            </a>
            <div class="brand-name">HOLOFLY</div>
        </header>

            <div class="choice-list">
                <a class="choice-card choice-card--creative" href="https://holofly.com.br/criativos">
                    <div>
                        <div class="choice-heading">
                            <span class="choice-symbol" aria-hidden="true">✦</span>
                            <span>SOU CRIATIVO</span>
                        </div>

                    </div>
                    <span class="choice-cta">Começar como criativo <span aria-hidden="true">→</span></span>
                </a>

                <a class="choice-card choice-card--business" href="https://holofly.com.br/negocios">
                    <div>

                            <span>QUERO CONTRATAR</span>
                        </div>

                    </div>
                    <span class="choice-cta">Encontrar criativos <span aria-hidden="true">→</span></span>
                </a>
            </div>

            <a class="about-link" href="https://holofly.com.br">
                <span>
                    <strong>Conheça a Holofly</strong>
                    <small>Entenda melhor como a plataforma funciona.</small>
                </span>
                <span class="about-arrow" aria-hidden="true">→</span>

        </section>

        <div class="page-end">
            <nav class="social-links" aria-label="Redes sociais da Holofly">

                    <span>Instagram</span>
                </a>
                <a class="social-link" href="https://www.facebook.com/profile.php?id=61580622752588" target="_blank" rel="noopener noreferrer">
                    <img src="../icons/Facebook_Logo_Primary.png" alt="" width="2084" height="2084" loading="lazy" decoding="async">
                    <span>Facebook</span>
                </a>
            </nav>

            <footer class="links-footer">© 2026 Holofly</footer>
        </div>
    </main>
</body>
